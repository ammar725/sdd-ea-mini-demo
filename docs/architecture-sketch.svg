<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>HR Policy Assistant: direct LLM call breaks RULE-03; routing through the AI Gateway fixes it</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <marker id="ahRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d62728"/></marker>
    <marker id="ahBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
  </defs>

  <rect width="1100" height="500" fill="#ffffff"/>

  <!-- Zones -->
  <rect x="20" y="30" width="770" height="390" rx="10" fill="#fffbea" stroke="#b8a94a" stroke-width="1.5"/>
  <text x="405" y="56" text-anchor="middle" font-size="15" font-weight="600" fill="#6b5f1a">Corporate network (trusted)</text>
  <rect x="830" y="30" width="250" height="390" rx="10" fill="#fff5f5" stroke="#d62728" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="955" y="56" text-anchor="middle" font-size="15" font-weight="600" fill="#a61b1b">Third-party SaaS (untrusted)</text>

  <!-- Components -->
  <g font-size="14" fill="#222" text-anchor="middle">
    <rect x="40" y="160" width="115" height="56" rx="6" fill="#eef0ff" stroke="#8b8fd6"/>
    <text x="97" y="193">Employee</text>

    <rect x="190" y="160" width="115" height="56" rx="6" fill="#eef0ff" stroke="#8b8fd6"/>
    <text x="247" y="193">Chat UI</text>

    <rect x="340" y="150" width="150" height="76" rx="6" fill="#eef0ff" stroke="#8b8fd6"/>
    <text x="415" y="184">Assistant service</text>
    <text x="415" y="204" font-size="12" fill="#555">AI app</text>

    <rect x="575" y="80" width="170" height="80" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
    <text x="660" y="113" font-weight="600" fill="#1d4ed8">AI Gateway</text>
    <text x="660" y="134" font-size="12" fill="#1d4ed8">log · redact · cost cap</text>

    <rect x="290" y="330" width="140" height="56" rx="6" fill="#eef0ff" stroke="#8b8fd6"/>
    <text x="360" y="363">HR policy library</text>

    <rect x="480" y="330" width="180" height="56" rx="6" fill="#eef0ff" stroke="#8b8fd6"/>
    <text x="570" y="363">HR system of record</text>

    <rect x="855" y="170" width="200" height="60" rx="6" fill="#eef0ff" stroke="#8b8fd6"/>
    <text x="955" y="205">External LLM provider</text>
  </g>

  <!-- Normal flows -->
  <g stroke="#444" stroke-width="1.6" fill="none" marker-end="url(#ah)">
    <line x1="155" y1="188" x2="188" y2="188"/>
    <line x1="305" y1="188" x2="338" y2="188"/>
    <line x1="395" y1="226" x2="368" y2="328"/>
    <line x1="445" y1="226" x2="545" y2="328"/>
  </g>
  <g font-size="12" fill="#444">
    <text x="335" y="285">read</text>
    <text x="505" y="285">read only</text>
  </g>

  <!-- 1: direct call (forbidden) -->
  <line x1="490" y1="208" x2="853" y2="208" stroke="#d62728" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#ahRed)"/>
  <g stroke="#d62728" stroke-width="3" stroke-linecap="round">
    <line x1="660" y1="198" x2="680" y2="218"/>
    <line x1="680" y1="198" x2="660" y2="218"/>
  </g>
  <text x="670" y="240" text-anchor="middle" font-size="13" font-weight="600" fill="#d62728">① Direct call: breaks RULE-03</text>

  <!-- 2: via gateway (fix) -->
  <g stroke="#1d4ed8" stroke-width="2.5" fill="none" marker-end="url(#ahBlue)">
    <polyline points="470,150 470,120 573,120"/>
    <polyline points="745,120 955,120 955,168"/>
  </g>
  <text x="762" y="108" text-anchor="start" font-size="13" font-weight="600" fill="#1d4ed8">② Through the gateway: conforms</text>

  <!-- Legend -->
  <g font-size="13" fill="#333">
    <line x1="40" y1="455" x2="90" y2="455" stroke="#444" stroke-width="1.6" marker-end="url(#ah)"/>
    <text x="100" y="460">Data flow</text>
    <line x1="210" y1="455" x2="260" y2="455" stroke="#d62728" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#ahRed)"/>
    <text x="270" y="460">① Before: forbidden direct call to an external AI model</text>
    <line x1="660" y1="455" x2="710" y2="455" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#ahBlue)"/>
    <text x="720" y="460">② After: routed through the AI Gateway (added for RULE-03)</text>
  </g>
</svg>
